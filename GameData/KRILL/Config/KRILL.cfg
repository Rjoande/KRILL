// Attach the KRILL data module to every part, mirroring how stock persists
// action-group assignments inside each part (this is what lets KRILL groups
// travel with craft files). ModuleKrill is inert and writes no child nodes
// unless the part actually holds KRILL assignments or group names.
@PART[*]:FOR[KRILL]
{
	MODULE
	{
		name = ModuleKrill
	}
}
