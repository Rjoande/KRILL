// KRILL localization master (English). Convention: every line carries a comment
// explaining where the string appears and any length constraint, to make
// translation possible without reading the code.
Localization
{
	en-us
	{
		// Stock settings page (Difficulty -> KRILL): title of the KRILL section.
		#LOC_KRILL_settings_title = KRILL
		// Settings page: label of the "highest visible group number" slider (20..99). Keep short, it sits left of a slider.
		#LOC_KRILL_settings_maxGroup = Highest visible group
		// Settings page: tooltip of the slider above. Explains that hidden data is never deleted.
		#LOC_KRILL_settings_maxGroup_tip = Upper bound of the group numbers offered by the KRILL window. Assignments above the cap are kept, just hidden until the cap is raised again.

		// 3-column window (2026-07-18 redesign): titlebar text (short, next to the close button).
		#LOC_KRILL_ui_windowTitle = KRILL
		// Small badge in the titlebar when opened in flight.
		#LOC_KRILL_ui_flightBadge = Flight
		// Small badge in the titlebar when opened in the editor (VAB/SPH).
		#LOC_KRILL_ui_editorBadge = Editor
		// Header of column 1 (uppercase in the UI, keep short).
		#LOC_KRILL_ui_colGroups = Action Groups
		// Header of column 2.
		#LOC_KRILL_ui_colParts = Parts
		// Header of column 3.
		#LOC_KRILL_ui_colActions = Actions
		// Column 2 (selected extended group): trailing button that starts the scene part-pick gesture.
		#LOC_KRILL_ui_addPart = + Part
		// Column 3 (selected part): trailing button that opens that part's action list.
		#LOC_KRILL_ui_addAction = + Action
		// Footer hint shown when no group is selected.
		#LOC_KRILL_ui_hint = Select a group to rename it, capture a key, or trigger it now.
		// Footer button, starts "press it now" bind capture for the selected group. Keep very short, it's a small button.
		#LOC_KRILL_ui_capture = Capture
		// Footer button (flight only), fires the selected group immediately regardless of its key. Keep very short, it's a small button.
		#LOC_KRILL_ui_trigger = Trigger
		// Footer info line next to Capture/Trigger. <<1>> = group number, <<2>> = its current key bind (or "-").
		#LOC_KRILL_ui_bindInfo = Group <<1>> — bind: <<2>>
		// Placeholder name shown for a group with no custom name yet, followed by its number (e.g. "Group 14"). Also the row/footer default before a rename.
		#LOC_KRILL_ui_groupDefaultName = Group
		// Column 2/3: shown when a selected STOCK group (1-10) has no stock-assigned actions on the active set.
		#LOC_KRILL_ui_noAssignments = (none)
		// Column 3: shown in place of an action's name when its reference can no longer be resolved on the part (see KrillActionRef.Resolve fallback logging).
		#LOC_KRILL_ui_unresolved = (unresolved)
		// Screen message when bind capture starts. <<1>> = group number.
		#LOC_KRILL_ui_captureStart = KRILL: press a key or joystick button for group <<1>> (Esc cancels)
		// Screen message when the player cancels a capture with Esc. Shared by group AND set-jump captures.
		#LOC_KRILL_ui_captureCancelled = KRILL: capture cancelled
		// Prefix word before the conflict list in a capture-result message, e.g. "(conflicts: stock 'RCS_TOGGLE')". Shared by group AND set-jump captures.
		#LOC_KRILL_ui_conflicts = conflicts
		// Screen message after capturing a bind for a stock group (1-10). <<1>> = group number, <<2>> = the captured key.
		#LOC_KRILL_ui_captureDoneStock = KRILL: group <<1>> bound to <<2>>
		// Appended to the message above when the capture also included modifiers, which stock groups 1-10 don't support (design doc §4 — layered modifiers are an extended-groups-only feature in the core).
		#LOC_KRILL_ui_modifiersIgnored = (modifiers ignored for stock groups)
		// Screen message after capturing a bind for an extended group (11+). <<1>> = group number, <<2>> = the captured bind description.
		#LOC_KRILL_ui_captureDone = KRILL: group <<1>> bound to <<2>>

		// M4: row under the set tabs, always visible. Shown INSIDE a per-set jump-key cell when no bind is captured yet (replaces the key description once one is set). Keep very short, the cell is narrow.
		#LOC_KRILL_ui_setJumpEmpty = Assign key
		// M4: screen message when a set-jump bind capture starts. <<1>> = set display name (e.g. "Default" or "Preset 2").
		#LOC_KRILL_ui_setCaptureStart = KRILL: press a key or joystick button to jump to <<1>> (Esc cancels)
		// M4: screen message after capturing a set-jump bind. <<1>> = set display name, <<2>> = the captured bind description.
		#LOC_KRILL_ui_setCaptureDone = KRILL: jump to <<1>> bound to <<2>>

		// Picker overlay: prompt shown while waiting for a scene click on a part.
		#LOC_KRILL_ui_pickPrompt = Click a part in the scene to select it (Esc cancels)
		// Picker overlay: generic Cancel button, used in both the part-pick and action-pick steps.
		#LOC_KRILL_ui_cancel = Cancel
		// Picker overlay: header of the action list. <<1>> = part title, <<2>> = target group number.
		#LOC_KRILL_ui_pickActionFor = Pick an action on '<<1>>' for group <<2>>
		// Picker overlay: shown when the picked part has no assignable actions at all.
		#LOC_KRILL_ui_noActions = This part has no actions.
		// Picker overlay: shown instead of an empty list when the part DOES have actions, but every one is already assigned to this (set, group) - distinct from ui_noActions above (2026-07-28).
		#LOC_KRILL_ui_allActionsAssigned = All of this part's actions are already assigned to this group.
		// Screen message after assigning an action to a group. <<1>> = action's display name, <<2>> = group number.
		#LOC_KRILL_ui_assignDone = KRILL: '<<1>>' assigned to group <<2>>

		// Footer button (extended groups only), cycles the group's actuation kind. Shown when the kind is Pulse (the default: a momentary contact — the group reads as on for a fraction of a second after it fires, then returns to off by itself). Keep very short, it's a small button.
		#LOC_KRILL_ui_kindPulse = Pulse
		// Same button as above, shown when the kind is Toggle (the player has declared the persisted bool meaningful, readable by other mods via KrillQuery.GetGroupState, and shown by the button below). Keep very short, it's a small button.
		#LOC_KRILL_ui_kindToggle = Toggle
		// Same button as above, shown when the kind is Hold (2026-08-19: active only while the key/UI control is physically held, mirrors stock's own Brakes action group). Keep very short, it's a small button.
		#LOC_KRILL_ui_kindHold = Hold
		// Footer button, shown only for Toggle-kind groups: displays the current persisted state and, on click, force-sets the OPPOSITE value directly (no action invoked) - a manual resync control for when the real part state drifted out of sync via another mod or the part's right-click menu. <<1>> = "0" or "1".
		#LOC_KRILL_ui_stateLabel = State: <<1>>
		// Footer button (2026-08-24, ALL groups including stock 1-10), cycles the group's console indicator type - a purely cosmetic severity label the future flight console will use to color the group's cell (no effect yet, console not built). Shown when the type is Info (the default, least alarming). Keep very short, it's a small button.
		#LOC_KRILL_ui_indicatorInfo = Info
		// Same button as above, shown when the type is Caution.
		#LOC_KRILL_ui_indicatorCaution = Caution
		// Same button as above, shown when the type is Warning.
		#LOC_KRILL_ui_indicatorWarning = Warning
	}
}
