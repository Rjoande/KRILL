// KRILL localization — Italian.
// Comments stay in English (project convention: code/cfg comments are
// English, player-facing values are localized) and mirror en-us.cfg exactly,
// key for key, so the two files stay easy to diff against each other.
Localization
{
	it-it
	{
		// Stock settings page (Difficulty -> KRILL): title of the KRILL section.
		#LOC_KRILL_settings_title = KRILL
		// Settings page: label of the "highest visible group number" slider (20..99). Keep short, it sits left of a slider.
		#LOC_KRILL_settings_maxGroup = Massimo gruppi visibili
		// Settings page: tooltip of the slider above. Explains that hidden data is never deleted.
		#LOC_KRILL_settings_maxGroup_tip = Limite superiore del numero di gruppo mostrati nella finestra KRILL. Le assegnazioni oltre il tetto vengono mantenute, solo nascoste finché il tetto non viene alzato di nuovo.

		// 3-column window (2026-07-18 redesign): titlebar text (short, next to the close button).
		#LOC_KRILL_ui_windowTitle = KRILL
		// Small badge in the titlebar when opened in flight.
		#LOC_KRILL_ui_flightBadge = Volo
		// Small badge in the titlebar when opened in the editor (VAB/SPH).
		#LOC_KRILL_ui_editorBadge = Editor
		// Header of column 1 (uppercase in the UI, keep short).
		#LOC_KRILL_ui_colGroups = Gruppi d'azione
		// Header of column 2.
		#LOC_KRILL_ui_colParts = Parti
		// Header of column 3.
		#LOC_KRILL_ui_colActions = Azioni
		// Column 2 (selected extended group): trailing button that starts the scene part-pick gesture.
		#LOC_KRILL_ui_addPart = + Parte
		// Column 3 (selected part): trailing button that opens that part's action list.
		#LOC_KRILL_ui_addAction = + Azione
		// Footer hint shown when no group is selected.
		#LOC_KRILL_ui_hint = Seleziona un gruppo per rinominarlo, assegnargli un tasto o attivarlo subito.
		// Footer button, starts "press it now" bind capture for the selected group. Keep very short, it's a small button.
		#LOC_KRILL_ui_capture = Cattura
		// Footer button (flight only), fires the selected group immediately regardless of its key. Keep very short, it's a small button.
		#LOC_KRILL_ui_trigger = Attiva
		// Footer info line next to Capture/Trigger. <<1>> = group number, <<2>> = its current key bind (or "-").
		#LOC_KRILL_ui_bindInfo = Gruppo <<1>> — tasto: <<2>>
		// Placeholder name shown for a group with no custom name yet, followed by its number (e.g. "Group 14"). Also the row/footer default before a rename.
		#LOC_KRILL_ui_groupDefaultName = Gruppo
		// Column 2/3: shown when a selected STOCK group (1-10) has no stock-assigned actions on the active set.
		#LOC_KRILL_ui_noAssignments = (nessuna)
		// Column 3: shown in place of an action's name when its reference can no longer be resolved on the part (see KrillActionRef.Resolve fallback logging).
		#LOC_KRILL_ui_unresolved = (non risolta)
		// Screen message when bind capture starts. <<1>> = group number.
		#LOC_KRILL_ui_captureStart = KRILL: premi un tasto o un pulsante joystick per il gruppo <<1>> (Esc annulla)
		// Screen message when the player cancels a capture with Esc. Shared by group AND set-jump captures.
		#LOC_KRILL_ui_captureCancelled = KRILL: cattura annullata
		// Prefix word before the conflict list in a capture-result message, e.g. "(conflicts: stock 'RCS_TOGGLE')". Shared by group AND set-jump captures.
		#LOC_KRILL_ui_conflicts = conflitti
		// Screen message after capturing a bind for a stock group (1-10). <<1>> = group number, <<2>> = the captured key.
		#LOC_KRILL_ui_captureDoneStock = KRILL: gruppo <<1>> associato a <<2>>
		// Appended to the message above when the capture also included modifiers, which stock groups 1-10 don't support (design doc §4 — layered modifiers are an extended-groups-only feature in the core).
		#LOC_KRILL_ui_modifiersIgnored = (modificatori ignorati per i gruppi stock)
		// Screen message after capturing a bind for an extended group (11+). <<1>> = group number, <<2>> = the captured bind description.
		#LOC_KRILL_ui_captureDone = KRILL: gruppo <<1>> associato a <<2>>

		// M4: row under the set tabs, always visible. Shown INSIDE a per-set jump-key cell when no bind is captured yet (replaces the key description once one is set). Keep very short, the cell is narrow.
		#LOC_KRILL_ui_setJumpEmpty = Assegna tasto
		// M4: screen message when a set-jump bind capture starts. <<1>> = set display name (e.g. "Default" or "Preset 2").
		#LOC_KRILL_ui_setCaptureStart = KRILL: premi un tasto o un pulsante joystick per passare a <<1>> (Esc annulla)
		// M4: screen message after capturing a set-jump bind. <<1>> = set display name, <<2>> = the captured bind description.
		#LOC_KRILL_ui_setCaptureDone = KRILL: passaggio a <<1>> associato a <<2>>

		// Picker overlay: prompt shown while waiting for a scene click on a part.
		#LOC_KRILL_ui_pickPrompt = Clicca su una parte nella scena per selezionarla (Esc annulla)
		// Picker overlay: generic Cancel button, used in both the part-pick and action-pick steps.
		#LOC_KRILL_ui_cancel = Annulla
		// Picker overlay: header of the action list. <<1>> = part title, <<2>> = target group number.
		#LOC_KRILL_ui_pickActionFor = Scegli un'azione su '<<1>>' per il gruppo <<2>>
		// Picker overlay: shown when the picked part has no assignable actions at all.
		#LOC_KRILL_ui_noActions = Questa parte non ha azioni.
			// Picker overlay: shown instead of an empty list when the part DOES have actions, but every one is already assigned to this (set, group) - distinct from ui_noActions above (2026-07-28).
			#LOC_KRILL_ui_allActionsAssigned = Tutte le azioni di questa parte sono già assegnate a questo gruppo.
		// Screen message after assigning an action to a group. <<1>> = action's display name, <<2>> = group number.
		#LOC_KRILL_ui_assignDone = KRILL: '<<1>>' assegnata al gruppo <<2>>
	}
}
