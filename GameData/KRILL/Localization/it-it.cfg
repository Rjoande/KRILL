// KRILL localization — Italian.
// Comments stay in English (project convention: code/cfg comments are
// English, player-facing values are localized) and mirror en-us.cfg exactly,
// key for key, so the two files stay easy to diff against each other.
Localization
{
	it-it
	{
		// Stock settings page (Difficulty -> KRILL): title of the KRILL section.
		#LOC_KRILL_settings_title = KRILL
		// Settings page: label of the "highest visible group number" slider (20..99). Keep short, it sits left of a slider.
		#LOC_KRILL_settings_maxGroup = Massimo gruppi visibili
		// Settings page: tooltip of the slider above. Explains that hidden data is never deleted.
		#LOC_KRILL_settings_maxGroup_tip = Limite superiore del numero di gruppo mostrati nella finestra KRILL. Le assegnazioni oltre il tetto vengono mantenute, solo nascoste finché il tetto non viene alzato di nuovo.
		// Settings page: label of the "highest visible axis number" slider (5..40, extended axes start at 5). Keep short, it sits left of a slider.
		#LOC_KRILL_settings_maxAxis = Massimo assi visibili
		// Settings page: tooltip of the axis slider above. Same rule as groups: hidden data is never deleted.
		#LOC_KRILL_settings_maxAxis_tip = Limite superiore del numero di asse mostrati nella finestra KRILL (A1-A4 sono gli assi personalizzati stock). Le assegnazioni oltre il tetto vengono mantenute, solo nascoste finché il tetto non viene alzato di nuovo.
		// Settings page: label of the extended-axis dead zone slider (0-50 %, default 5 % like stock). Keep short.
		#LOC_KRILL_settings_axisDeadzone = Zona morta assi
		// Settings page: tooltip of the dead zone slider. One value for every KRILL axis, applied when the axis is read - changing it needs no recapture.
		#LOC_KRILL_settings_axisDeadzone_tip = Zona morta applicata a tutti gli assi estesi di KRILL: un movimento del controller sotto questa frazione della corsa vale zero, il resto viene riscalato sull'intera corsa. Ha effetto immediato, senza ricatturare.
		// Settings page: label of the Spring-axis key attack slider (0-1000 ms, 0 = instant like stock). Keep short, it sits left of a slider.
		#LOC_KRILL_settings_axisKeyAttack = Tasti asse: corsa Molla (ms)
		// Settings page: tooltip of the slider above. "Precision mode" is stock's CapsLock mode.
		#LOC_KRILL_settings_axisKeyAttack_tip = Quanto impiega un tasto +/- tenuto a portare un asse Molla da un estremo all'altro. 0 = istantaneo, come i tasti dei custom axis stock. In precision mode si usa invece la rampa da tastiera stock.
		// Settings page: label of the Fixed-axis key speed slider (10-300 %/s, default 50). Keep short.
		#LOC_KRILL_settings_axisKeyRate = Tasti asse: velocità Fisso (%/s)
		// Settings page: tooltip of the slider above.
		#LOC_KRILL_settings_axisKeyRate_tip = Velocità con cui un tasto +/- tenuto muove un asse Fisso, in percentuale della corsa al secondo (50 = circa 2 s da estremo a estremo). In precision mode è ridotta a un quarto.

		// 3-column window (2026-07-18 redesign): titlebar text (short, next to the close button).
		#LOC_KRILL_ui_windowTitle = KRILL
		// Small badge in the titlebar when opened in flight.
		#LOC_KRILL_ui_flightBadge = Volo
		// Small badge in the titlebar when opened in the editor (VAB/SPH).
		#LOC_KRILL_ui_editorBadge = Editor
		// Header of column 1 (uppercase in the UI, keep short).
		#LOC_KRILL_ui_colGroups = Gruppi d'azione
		// Header of column 2.
		#LOC_KRILL_ui_colParts = Parti
		// Header of column 3.
		#LOC_KRILL_ui_colActions = Azioni
		// Column 2 (selected extended group): trailing button that starts the scene part-pick gesture.
		#LOC_KRILL_ui_addPart = + Parte
		// Column 3 (selected part): trailing button that opens that part's action list.
		#LOC_KRILL_ui_addAction = + Azione
		// Footer hint shown when no group is selected.
		#LOC_KRILL_ui_hint = Seleziona un gruppo per rinominarlo, assegnargli un tasto o attivarlo subito.
		// Footer button, starts "press it now" bind capture for the selected group. Keep very short, it's a small button.
		#LOC_KRILL_ui_capture = Cattura
		// Footer button (flight only), fires the selected group immediately regardless of its key. Keep very short, it's a small button.
		#LOC_KRILL_ui_trigger = Attiva
		// Footer info line next to Capture/Trigger. <<1>> = group number, <<2>> = its current key bind (or "-").
		#LOC_KRILL_ui_bindInfo = Gruppo <<1>> — tasto: <<2>>
		// Placeholder name shown for a group with no custom name yet, followed by its number (e.g. "Group 14"). Also the row/footer default before a rename.
		#LOC_KRILL_ui_groupDefaultName = Gruppo
		// Column 2/3: shown when a selected STOCK group (1-10) has no stock-assigned actions on the active set.
		#LOC_KRILL_ui_noAssignments = (nessuna)
		// Column 3: shown in place of an action's name when its reference can no longer be resolved on the part (see KrillActionRef.Resolve fallback logging).
		#LOC_KRILL_ui_unresolved = (non risolta)
		// Screen message when bind capture starts. <<1>> = group number. Delete during the capture removes the existing key instead.
		#LOC_KRILL_ui_captureStart = KRILL: premi un tasto o un pulsante joystick per il gruppo <<1>> (Esc annulla, Canc rimuove il bind)
		// Screen message when the player cancels a capture with Esc. Shared by group AND set-jump captures.
		#LOC_KRILL_ui_captureCancelled = KRILL: cattura annullata
		// Prefix word before the conflict list in a capture-result message, e.g. "(conflicts: stock 'RCS_TOGGLE')". Shared by group AND set-jump captures.
		#LOC_KRILL_ui_conflicts = conflitti
		// Screen message after capturing a bind for a stock group (1-10). <<1>> = group number, <<2>> = the captured key.
		#LOC_KRILL_ui_captureDoneStock = KRILL: gruppo <<1>> associato a <<2>>
		// Appended to the message above when the capture also included modifiers, which stock groups 1-10 don't support (design doc §4 — layered modifiers are an extended-groups-only feature in the core).
		#LOC_KRILL_ui_modifiersIgnored = (modificatori ignorati per i gruppi stock)
		// Screen message after capturing a bind for an extended group (11+). <<1>> = group number, <<2>> = the captured bind description.
		#LOC_KRILL_ui_captureDone = KRILL: gruppo <<1>> associato a <<2>>
		// Screen message after the player pressed Delete during a group capture (2026-09-09): the group's key (stock or extended) is removed. <<1>> = group number.
		#LOC_KRILL_ui_captureCleared = KRILL: il gruppo <<1>> non ha più un tasto

		// M4: row under the set tabs, always visible. Shown INSIDE a per-set jump-key cell when no bind is captured yet (replaces the key description once one is set). Keep very short, the cell is narrow.
		#LOC_KRILL_ui_setJumpEmpty = Assegna tasto
		// M4: screen message when a set-jump bind capture starts. <<1>> = set display name (e.g. "Default" or "Preset 2").
		#LOC_KRILL_ui_setCaptureStart = KRILL: premi un tasto o un pulsante joystick per passare a <<1>> (Esc annulla, Canc rimuove il bind)
		// M4: screen message after capturing a set-jump bind. <<1>> = set display name, <<2>> = the captured bind description.
		#LOC_KRILL_ui_setCaptureDone = KRILL: passaggio a <<1>> associato a <<2>>
		// Screen message after the player pressed Delete during a set-jump capture. <<1>> = set display name.
		#LOC_KRILL_ui_setCaptureCleared = KRILL: il passaggio a <<1>> non ha più un tasto

		// Picker overlay: prompt shown while waiting for a scene click on a part.
		#LOC_KRILL_ui_pickPrompt = Clicca su una parte nella scena per selezionarla (Esc annulla)
		// Picker overlay: generic Cancel button, used in both the part-pick and action-pick steps.
		#LOC_KRILL_ui_cancel = Annulla
		// Picker overlay: header of the action list. <<1>> = part title, <<2>> = target group number.
		#LOC_KRILL_ui_pickActionFor = Scegli un'azione su '<<1>>' per il gruppo <<2>>
		// Picker overlay: shown when the picked part has no assignable actions at all.
		#LOC_KRILL_ui_noActions = Questa parte non ha azioni.
		// Picker overlay: shown instead of an empty list when the part DOES have actions, but every one is already assigned to this (set, group) - distinct from ui_noActions above (2026-07-28).
		#LOC_KRILL_ui_allActionsAssigned = Tutte le azioni di questa parte sono già assegnate a questo gruppo.
		// Screen message after assigning an action to a group. <<1>> = action's display name, <<2>> = group number.
		#LOC_KRILL_ui_assignDone = KRILL: '<<1>>' assegnata al gruppo <<2>>

		// Footer button (extended groups only), cycles the group's actuation kind. Shown when the kind is Pulse (the default: a momentary contact — the group reads as on for a fraction of a second after it fires, then returns to off by itself). Keep very short, it's a small button.
		#LOC_KRILL_ui_kindPulse = Impulso
		// Same button as above, shown when the kind is Toggle (the player has declared the persisted bool meaningful, readable by other mods via KrillQuery.GetGroupState, and shown by the button below). Keep very short, it's a small button.
		#LOC_KRILL_ui_kindToggle = Persistente
		// Same button as above, shown when the kind is Hold (2026-08-19: active only while the key/UI control is physically held, mirrors stock's own Brakes action group). Keep very short, it's a small button.
		#LOC_KRILL_ui_kindHold = Mantieni
		// Footer button, shown only for Toggle-kind groups: displays the current persisted state and, on click, force-sets the OPPOSITE value directly (no action invoked) - a manual resync control for when the real part state drifted out of sync via another mod or the part's right-click menu. <<1>> = "0" or "1".
		#LOC_KRILL_ui_stateLabel = Stato: <<1>>
		// Footer button (2026-08-24, ALL groups including stock 1-10), cycles the group's console indicator type - a purely cosmetic severity label the future flight console will use to color the group's cell (no effect yet, console not built). Shown when the type is Info (the default, least alarming). Keep very short, it's a small button.
		#LOC_KRILL_ui_indicatorInfo = Info
		// Same button as above, shown when the type is Caution.
		#LOC_KRILL_ui_indicatorCaution = Cautela
		// Same button as above, shown when the type is Warning.
		#LOC_KRILL_ui_indicatorWarning = Avviso

		// ---- Extended axes (2026-09-07, A2). Column 1, fold header of the Axes section (uppercase-ish bold, prefixed with a ▸/▾ glyph by the code). Keep short.
		#LOC_KRILL_ui_axesSection = Gruppi di assi
		// Placeholder name for an extended axis with no custom name yet, followed by its number (e.g. "Asse 5"). Stock axes A1-A4 use stock's own #autoLOC names instead.
		#LOC_KRILL_ui_axisDefaultName = Asse
		// Header of column 3 when an AXIS is selected (replaces "Actions"): the part's axis fields.
		#LOC_KRILL_ui_colFields = Campi
		// Column 3 (selected part, axis mode): trailing button that opens that part's axis-field list.
		#LOC_KRILL_ui_addField = + Campo
		// Footer info line in axis mode. <<1>> = axis number, <<2>> = its current bind (or "-").
		#LOC_KRILL_ui_axisInfo = Asse <<1>> — bind: <<2>>
		// Bind text of an axis whose +/- keys are set: the stock keys of A1-A4, or KRILL's own keys of an extended axis (K2). <<1>> = the controller channel (or "-"), <<2>> = the "plus" key (or "-"), <<3>> = the "minus" key (or "-").
		#LOC_KRILL_ui_axisStockKeys = <<1>> (tasti +<<2>> / -<<3>>)
		// Footer button (extended axes only), one four-state cycle: Spring rest 0 -> Spring rest -1 -> Spring rest +1 -> Fixed. This is the Fixed state (the axis stays where it was put - a throttle). Keep very short.
		#LOC_KRILL_ui_axisKindFixed = Fisso
		// Same four-state button, the three Spring states (released, the axis returns to its rest value by itself - a flight stick). <<1>> = the rest value: 0, -1 or +1. Keep very short.
		#LOC_KRILL_ui_axisKindSpringRest = Molla <<1>>
		// Column 3 option button (per assigned field), cycles normal <-> inverted (stock wording: "Comandi normali/invertiti"). Shown when the field follows the axis as-is. Very small button, keep to one short word.
		#LOC_KRILL_ui_fieldNormal = Normale
		// Same button, shown when the axis value is negated before reaching the field.
		#LOC_KRILL_ui_fieldInverted = Invertita
		// Column 3 option button (per assigned field), cycles absolute <-> incremental. Absolute: the axis position maps straight onto the field's range (stock "Controllo assoluto"). Very small button.
		#LOC_KRILL_ui_fieldAbsolute = Assoluto
		// Same button, shown when the axis deflection nudges the field over time instead (stock "Controllo incrementale").
		#LOC_KRILL_ui_fieldIncremental = Incrementale
		// Column 3 option button (incremental fields only), cycles the speed step. <<1>> = percent of the field's full range per second at full deflection (stock shows the same unit).
		#LOC_KRILL_ui_fieldSpeed = <<1>>%/s
		// Picker overlay (axis mode): prompt while waiting for a scene click; only parts with usable axis fields can be picked.
		#LOC_KRILL_ui_pickPromptAxis = Clicca una parte con campi asse per selezionarla (Esc annulla)
		// Picker overlay (axis mode): header of the field list. <<1>> = part title, <<2>> = target axis number.
		#LOC_KRILL_ui_pickFieldFor = Scegli un campo su '<<1>>' per l'asse <<2>>
		// Picker overlay (axis mode): shown when the part exposes no usable axis field at all.
		#LOC_KRILL_ui_noFields = Questa parte non ha campi asse.
		// Picker overlay (axis mode): the part DOES have axis fields, but every one is already assigned to this (set, axis).
		#LOC_KRILL_ui_allFieldsAssigned = Tutti i campi asse di questa parte sono già assegnati a quest'asse.
		// Screen message after assigning an axis field. <<1>> = field caption, <<2>> = axis number.
		#LOC_KRILL_ui_assignFieldDone = KRILL: '<<1>>' assegnato all'asse <<2>>
		// Screen message when an AXIS bind capture starts (A3). <<1>> = axis number. Only controller axes are captured; Delete/Backspace during the capture removes the axis's existing bind (an unbound axis is the one the console can drive by mouse).
		#LOC_KRILL_ui_axisCaptureStart = KRILL: muovi un asse del controller per l'asse <<1>> (Esc annulla, Canc rimuove il bind)
		// Screen message after capturing a controller axis. <<1>> = axis number, <<2>> = the channel's stock-style title (e.g. "VKB Gladiator Asse 3").
		#LOC_KRILL_ui_axisCaptureDone = KRILL: asse <<1>> associato a <<2>>
		// Screen message after the player pressed Delete during an axis capture. <<1>> = axis number.
		#LOC_KRILL_ui_axisCaptureCleared = KRILL: l'asse <<1>> non è più associato a un asse del controller
		// Screen message when a +/- KEY capture for an extended axis starts (K2). <<1>> = axis number, <<2>> = "+" or "-". Keys and joystick buttons with modifiers, like a group capture.
		#LOC_KRILL_ui_axisKeyCaptureStart = KRILL: premi un tasto o un pulsante del joystick come tasto <<2>> dell'asse <<1>> (Esc annulla, Canc lo rimuove)
		// Screen message after capturing a +/- key for an axis. <<1>> = axis number, <<2>> = "+" or "-", <<3>> = the captured bind description.
		#LOC_KRILL_ui_axisKeyCaptureDone = KRILL: tasto <<2>> dell'asse <<1>> associato a <<3>>
		// Screen message after the player pressed Delete during a +/- key capture. <<1>> = axis number, <<2>> = "+" or "-".
		#LOC_KRILL_ui_axisKeyCaptureCleared = KRILL: l'asse <<1>> non ha più il tasto <<2>>
	}
}
